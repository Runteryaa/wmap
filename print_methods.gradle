tasks.register("printBeacon") {
    dependsOn compileJava
    doLast {
        def urls = sourceSets.main.compileClasspath.files.collect { it.toURI().toURL() } as java.net.URL[]
        def cl = new java.net.URLClassLoader(urls, Thread.currentThread().getContextClassLoader())
        def clazz = Class.forName("net.minecraft.client.renderer.blockentity.BeaconRenderer", false, cl)
        clazz.getMethods().each { method ->
            if (method.name == "renderBeaconBeam") {
                println "SIGNATURE: " + method.toString()
            }
        }
    }
}
