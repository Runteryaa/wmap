name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog for this release'
        required: false
        default: 'General bug fixes and improvements'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: 26.1.2
            fabric_api_version: 0.151.0+26.1.2
            loom_version: 1.16-SNAPSHOT
          - minecraft_version: 26.2
            fabric_api_version: 0.161.0+26.2
            loom_version: 1.17.9
          - minecraft_version: 26.3
            fabric_api_version: 0.161.0+26.3
            loom_version: 1.17.9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build for Minecraft ${{ matrix.minecraft_version }}
        run: >-
          ./gradlew build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pfabric_api_version=${{ matrix.fabric_api_version }}
          -Ploom_version=${{ matrix.loom_version }}
      - name: Save universal jar
        if: matrix.minecraft_version == '26.1.2'
        uses: actions/upload-artifact@v4
        with:
          name: worldmap-universal
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download universal jar
        uses: actions/download-artifact@v4
        with:
          path: build/libs
          merge-multiple: true
      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
      - name: Generate Changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --format="### %s%n%b" > CHANGELOG.md
          else
            git log ${LAST_TAG}..HEAD --format="### %s%n%b" > CHANGELOG.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md
          files: build/libs/*.jar
          generate_release_notes: false
